name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Check that files referenced by index.html exist
        run: |
          for f in css/style.css js/app.js js/data.js js/model.js; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          grep -q 'js/app.js' index.html && grep -q 'css/style.css' index.html
